services:
  viora:
    build: .
    image: viora
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./faiss_db:/app/faiss_db
      - ./data:/app/data
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:/app/mlruns
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s